[project]
name = "agentic-router-fde-module3"
version = "0.1.0"
description = "Module 3 - Production Agentic RAG & AI Systems"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # transformers/sentence-transformers pins matter: newer versions break
    # nomic-embed-text-v1.5's trust_remote_code path.
    "transformers==4.48.0",
    "sentence-transformers==3.4.1",
    "einops==0.8.1",
    "torch>=2.2",
    "faiss-cpu",
    "qdrant-client",
    "openai",
    "requests",
    "numpy",
    "python-dotenv",
    "nest-asyncio",
    "matplotlib",
    # notebook execution
    "jupyter",
    "nbconvert",
    "ipykernel",
    "httpx>=0.28.1",
]

[tool.uv]
package = false
